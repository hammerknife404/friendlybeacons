name: Release

# Two ways to release:
# - Push a tag like v1.4.0 that matches mod_version.
# - Run this workflow by hand on main ("Run workflow" in the Actions tab). It reads
#   mod_version, creates the matching tag and release on the current commit, and
#   refuses if that tag already exists.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the release tag
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match mod_version $version"
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "Run this workflow on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already exists. Bump mod_version in gradle.properties first."
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build

      - name: Attach jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a manual run this also creates the tag, on the commit that was built.
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "Friendly Beacons $VERSION" --generate-notes
          gh release upload "$TAG" "build/libs/friendlybeacons-$VERSION.jar" --clobber
